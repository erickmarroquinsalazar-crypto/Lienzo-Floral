<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lienzo Floral · CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f7f4ef;font-family:'DM Sans',sans-serif;color:#2c2c2c}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#d0cab8;border-radius:4px}
/* layout */
.lf{display:flex;height:100vh;overflow:hidden}
.sb{width:200px;min-width:200px;background:#222;display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:24px 18px 20px;border-bottom:1px solid #2e2e2e}
.sb-logo h1{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:300;color:#f0ebe2;line-height:1.25}
.sb-logo p{font-size:10px;color:#555;letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}
.sb-nav{flex:1;padding:12px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:11px 18px;cursor:pointer;font-size:13px;color:#777;transition:all .13s;border-left:3px solid transparent}
.ni:hover{background:#2a2a2a;color:#eee}
.ni.on{background:#2e2e2e;color:#f0ebe2;border-left-color:#7a9e7e}
.sb-foot{padding:13px 18px;border-top:1px solid #2e2e2e;font-size:10.5px;color:#444}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid #e8e2d9;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tbtitle{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300}
.page{flex:1;overflow-y:auto;padding:24px 28px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .13s;white-space:nowrap}
.b-dark{background:#2c2c2c;color:#fff}.b-dark:hover{background:#3a3a3a}
.b-sage{background:#7a9e7e;color:#fff}.b-sage:hover{background:#6b8e6f}
.b-rose{background:#c97b84;color:#fff}.b-rose:hover{background:#b86970}
.b-ghost{background:transparent;color:#7a7a7a;border:1px solid #e8e2d9}.b-ghost:hover{background:#f7f4ef;color:#2c2c2c}
.b-red{background:#fde8e8;color:#9e3a3a;border:none}.b-red:hover{background:#f5d0d0}
.b-sm{padding:5px 12px;font-size:12px}
/* cards */
.card{background:#fff;border-radius:12px;border:1px solid #e8e2d9;overflow:hidden;margin-bottom:18px}
.ch{padding:15px 20px;border-bottom:1px solid #e8e2d9;display:flex;align-items:center;justify-content:space-between}
.ch h3{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400}
/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
/* stat */
.stat{background:#fff;border-radius:12px;border:1px solid #e8e2d9;padding:18px}
.sn{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;line-height:1}
.sl{font-size:11px;color:#7a7a7a;margin-top:5px;letter-spacing:.4px;text-transform:uppercase}
/* rows */
.crow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #e8e2d9;transition:background .1s}
.crow:last-child{border-bottom:none}.crow:hover{background:#faf8f4}
.dr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #e8e2d9}
.dr:last-child{border-bottom:none}
.dd{min-width:52px;text-align:center;background:#f7f4ef;border-radius:8px;padding:6px 4px}
.ddn{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;line-height:1}
.ddm{font-size:10px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.4px}
/* avatar */
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c8dbc9,#e8c8cb);display:flex;align-items:center;justify-content:center;font-size:16px;font-family:'Cormorant Garamond',serif;color:#3a5a3a;font-weight:600;flex-shrink:0}
/* tag */
.tag{display:inline-block;background:#f0ebe2;color:#6a5a40;padding:2px 8px;border-radius:12px;font-size:10.5px;margin-right:3px;margin-top:2px}
/* form */
.fld{margin-bottom:15px}
.flbl{display:block;font-size:11px;font-weight:500;color:#7a7a7a;margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase}
.inp{width:100%;padding:9px 12px;border:1px solid #e8e2d9;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:#2c2c2c;background:#fff;outline:none}
.inp:focus{border-color:#7a9e7e}
textarea.inp{resize:vertical;min-height:68px}
select.inp{appearance:none;cursor:pointer}
.si{width:100%;padding:8px 12px;border:1px solid #e8e2d9;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:#f7f4ef;color:#2c2c2c;outline:none}
.si:focus{border-color:#7a9e7e}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;width:92%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.18)}
.modal.wide{max-width:680px}
.mhead{padding:20px 22px 16px;border-bottom:1px solid #e8e2d9;display:flex;justify-content:space-between;align-items:flex-start}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300}
.msub{font-size:12px;color:#7a7a7a;margin-top:3px}
.mclose{background:none;border:none;cursor:pointer;font-size:22px;color:#9a9a9a;line-height:1;padding:0 0 0 12px}
.mbody{padding:18px 22px 22px}
/* message cards */
.mc{background:#faf8f4;border:1px solid #e8e2d9;border-radius:10px;padding:13px 15px;margin-bottom:11px}
.mc-lbl{font-size:10.5px;font-weight:500;color:#9a9a9a;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.mc-txt{font-size:13.5px;color:#2c2c2c;line-height:1.65}
.mc-cat{font-size:11px;font-weight:600;color:#7a9e7e;letter-spacing:1.4px;text-transform:uppercase;margin:18px 0 9px;display:flex;align-items:center;gap:6px}
/* promo card special */
.promo-card{background:linear-gradient(135deg,#fff5f5,#fff9f0);border:1.5px solid #f0d0d0;border-radius:12px;overflow:hidden;margin-bottom:11px}
.promo-img{width:100%;height:180px;object-fit:cover;display:block}
.promo-body{padding:13px 15px}
.promo-price{display:inline-block;background:#c97b84;color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:6px}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdn{text-align:center;font-size:11px;font-weight:500;color:#9a9a9a;padding:4px;letter-spacing:.4px}
.cday{border-radius:7px;min-height:74px;padding:5px;border:1px solid transparent;cursor:pointer;transition:border-color .1s}
.cday:hover{border-color:#7a9e7e}
.ctoday{background:#f5f0ea;border-color:#e8e2d9 !important}
.cnum{font-size:11.5px;font-weight:500;color:#9a9a9a;margin-bottom:3px}
.ctoday .cnum{color:#c97b84;font-weight:700}
.cev{font-size:9.5px;border-radius:3px;padding:2px 5px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#fff}
.evc{background:#7a9e7e}.evp{background:#c47a1e}.evd{background:#4a4a6a}.evx{background:#9e3a3a}
/* badge */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500}
/* toast */
.toast{position:fixed;bottom:22px;right:22px;background:#2c2c2c;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:su .17s ease;pointer-events:none}
@keyframes su{from{transform:translateY(7px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:32px 16px;color:#9a9a9a;font-size:14px}
.empty-ic{font-size:30px;margin-bottom:8px}
.scroll-inner{overflow-y:auto;max-height:320px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="lf" id="app">

  <!-- SIDEBAR -->
  <div class="sb">
    <div class="sb-logo">
      <h1>Lienzo<br>Floral</h1>
      <p>CRM · Gestión</p>
    </div>
    <nav class="sb-nav" id="sb-nav">
      <div class="ni on" data-tab="dashboard">🌸 &nbsp;Panel</div>
      <div class="ni" data-tab="clients">👤 &nbsp;Clientes</div>
      <div class="ni" data-tab="messages">💬 &nbsp;Mensajes</div>
      <div class="ni" data-tab="calendar">📅 &nbsp;Calendario</div>
      <div class="ni" data-tab="deliveries">🚚 &nbsp;Entregas</div>
    </nav>
    <div class="sb-foot" id="sb-foot">@lienzo.floral</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="tbtitle" id="topbar-title">Panel Principal</span>
      <div id="topbar-actions"></div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast hidden" id="toast"></div>

<!-- MODAL CONTAINER -->
<div id="modal-container"></div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DAYS   = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const TODAY  = new Date().toISOString().split("T")[0];

const SEED_CLIENTS = [
  {id:1,name:"Sofía Martínez",phone:"5512345678",email:"sofia@email.com",lastPurchase:"2026-04-10",totalOrders:3,tags:["boda","frecuente"],notes:"Le gustan las rosas blancas y las peonías"},
  {id:2,name:"Ana Torres",phone:"5598765432",email:"ana@email.com",lastPurchase:"2026-04-22",totalOrders:1,tags:["primera compra"],notes:"Arreglo de cumpleaños, cliente nueva"},
  {id:3,name:"Carlos Vega",phone:"5511112222",email:"carlos@email.com",lastPurchase:"2026-03-15",totalOrders:5,tags:["corporativo","frecuente"],notes:"Pedidos para oficina cada mes"},
  {id:4,name:"Lucía Herrera",phone:"5533334444",email:"lucia@email.com",lastPurchase:"2026-04-28",totalOrders:2,tags:["aniversario"],notes:"Siempre pide caja con chocolates"},
];
const SEED_DELIVERIES = [
  {id:1,clientId:1,clientName:"Sofía Martínez",date:"2026-05-05",time:"10:00",address:"Calle Rosal 45, Col. Jardines",product:"Ramo de novia - Rosas blancas",status:"confirmed",notes:""},
  {id:2,clientId:3,clientName:"Carlos Vega",date:"2026-05-06",time:"14:00",address:"Av. Insurgentes 1200, Piso 3",product:"Arreglo corporativo mensual",status:"pending",notes:"Pasa por recepción"},
  {id:3,clientId:4,clientName:"Lucía Herrera",date:"2026-05-10",time:"12:00",address:"Privada Magnolia 8",product:"Caja de flores + chocolates",status:"confirmed",notes:""},
  {id:4,clientId:2,clientName:"Ana Torres",date:"2026-05-12",time:"09:00",address:"Lomas de Chapultepec 22",product:"Bouquet de cumpleaños",status:"pending",notes:""},
];

// ─── STORAGE (localStorage – permanente en tu navegador) ───────────────────
function load(key, seed) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : seed; } catch(e){ return seed; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

let clients    = load("lf_clients",    SEED_CLIENTS);
let deliveries = load("lf_deliveries", SEED_DELIVERIES);

function saveClients()    { save("lf_clients",    clients);    updateFooter(); }
function saveDeliveries() { save("lf_deliveries", deliveries); }
function updateFooter()   { document.getElementById("sb-foot").textContent = `@lienzo.floral · ${clients.length} clientes`; }
updateFooter();

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const daysSince = d => Math.floor((new Date() - new Date(d)) / 86400000);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function badge(s){
  const m={confirmed:["#3a7d5e","#d4f0e3","Confirmada"],pending:["#c47a1e","#fef3da","Pendiente"],delivered:["#4a4a6a","#ebebf5","Entregada"],cancelled:["#9e3a3a","#fde8e8","Cancelada"]};
  const [c,bg,l]=m[s]||m.pending;
  return `<span class="badge" style="background:${bg};color:${c}">${l}</span>`;
}
function av(name){ return `<div class="av">${(name||"?")[0].toUpperCase()}</div>`; }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.remove("hidden");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hidden"),2700);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
let currentTab = "dashboard";
let searchQ = "";
let selectedClientId = null;
let calMonth = new Date().getMonth();
let calYear  = new Date().getFullYear();

document.getElementById("sb-nav").addEventListener("click", e=>{
  const ni = e.target.closest(".ni");
  if(!ni) return;
  switchTab(ni.dataset.tab);
});

function switchTab(tab){
  currentTab = tab;
  searchQ = "";
  document.querySelectorAll(".ni").forEach(n=>n.classList.toggle("on", n.dataset.tab===tab));
  const titles={dashboard:"Panel Principal",clients:"Clientes",messages:"Mensajes & Seguimiento",calendar:"Calendario de Entregas",deliveries:"Gestión de Entregas"};
  document.getElementById("topbar-title").textContent = titles[tab];
  renderActions();
  renderPage();
}

function renderActions(){
  const el = document.getElementById("topbar-actions");
  if(currentTab==="clients")
    el.innerHTML=`<button class="btn b-dark" onclick="openClientModal()">+ Nuevo Cliente</button>`;
  else if(currentTab==="calendar"||currentTab==="deliveries")
    el.innerHTML=`<button class="btn b-sage" onclick="openDelivModal()">+ Agendar Entrega</button>`;
  else el.innerHTML="";
}

// ─── RENDER PAGE ─────────────────────────────────────────────────────────────
function renderPage(){
  const page = document.getElementById("page");
  if(currentTab==="dashboard") page.innerHTML = renderDashboard();
  else if(currentTab==="clients")   page.innerHTML = renderClients();
  else if(currentTab==="messages")  page.innerHTML = renderMessages();
  else if(currentTab==="calendar")  page.innerHTML = renderCalendar();
  else if(currentTab==="deliveries")page.innerHTML = renderDeliveries();
  bindPageEvents();
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard(){
  const nowYM = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,"0")}`;
  const thisMD = deliveries.filter(d=>d.date.startsWith(nowYM)).length;
  const pendN  = deliveries.filter(d=>d.status==="pending").length;
  const recon  = clients.filter(c=>daysSince(c.lastPurchase)>25);
  const upcoming = deliveries.filter(d=>d.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  return `
  <div class="g4" style="margin-bottom:18px">
    ${[["🌿",clients.length,"Clientes totales"],["📦",thisMD,"Entregas este mes"],["⏳",pendN,"Pendientes"],["💌",recon.length,"A reconectar"]].map(([ic,n,l])=>`
    <div class="stat"><div style="font-size:20px;margin-bottom:6px">${ic}</div><div class="sn">${n}</div><div class="sl">${l}</div></div>`).join("")}
  </div>
  <div class="g2">
    <div class="card">
      <div class="ch"><h3>Próximas Entregas</h3><button class="btn b-ghost b-sm" onclick="switchTab('calendar')">Ver calendario</button></div>
      ${upcoming.length ? upcoming.map(d=>`
      <div class="dr">
        <div class="dd"><div class="ddn">${d.date.split("-")[2]}</div><div class="ddm">${MONTHS[parseInt(d.date.split("-")[1])-1].slice(0,3)}</div></div>
        <div style="flex:1"><div style="font-size:13.5px;font-weight:500">${esc(d.clientName)}</div><div style="font-size:12px;color:#7a7a7a">${esc(d.product)}</div></div>
        ${badge(d.status)}
      </div>`).join("") : `<div class="empty"><div class="empty-ic">📭</div>Sin entregas próximas</div>`}
    </div>
    <div class="card">
      <div class="ch"><h3>Reconectar</h3><button class="btn b-ghost b-sm" onclick="switchTab('messages')">Ir a mensajes</button></div>
      ${recon.length ? recon.slice(0,5).map(c=>`
      <div class="crow" style="cursor:pointer" data-sel-client="${c.id}">
        ${av(c.name)}
        <div style="flex:1"><div style="font-size:13.5px;font-weight:500">${esc(c.name)}</div><div style="font-size:12px;color:#7a7a7a">Sin compra hace ${daysSince(c.lastPurchase)} días</div></div>
        <button class="btn b-rose b-sm" data-sel-client="${c.id}">Mensaje</button>
      </div>`).join("") : `<div class="empty"><div class="empty-ic">🎉</div>¡Todos los clientes activos!</div>`}
    </div>
  </div>`;
}

// ── CLIENTS ──────────────────────────────────────────────────────────────────
function renderClients(){
  const q = searchQ.toLowerCase();
  const filtered = clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)||(c.tags||[]).join(" ").toLowerCase().includes(q));
  return `
  <div style="margin-bottom:13px"><input class="si" id="search-inp" placeholder="Buscar por nombre, teléfono o etiqueta…" value="${esc(searchQ)}"/></div>
  <div class="card">
    <div class="ch"><h3>${filtered.length} cliente${filtered.length!==1?"s":""}</h3></div>
    ${filtered.length ? filtered.map(c=>`
    <div class="crow">
      ${av(c.name)}
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500">${esc(c.name)}</div>
        <div style="font-size:12px;color:#7a7a7a">${esc(c.phone)}${c.email?` · ${esc(c.email)}`:""}</div>
        <div style="margin-top:2px">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        ${c.notes?`<div style="font-size:11px;color:#9a9a9a;margin-top:2px;font-style:italic">"${esc(c.notes)}"</div>`:""}
      </div>
      <div style="text-align:right;margin-right:10px;flex-shrink:0">
        <div style="font-size:11px;color:#9a9a9a">Última compra</div>
        <div style="font-size:13px;font-weight:500">${c.lastPurchase}</div>
        <div style="font-size:11px;color:#9a9a9a">${c.totalOrders} pedido${c.totalOrders!==1?"s":""}</div>
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="btn b-sage b-sm" onclick="openMsgModal(${c.id})">✉️</button>
        <button class="btn b-ghost b-sm" onclick="openWA('${esc(c.phone)}','¡Hola ${esc(c.name)}!')">💬</button>
        <button class="btn b-ghost b-sm" onclick="openClientModal(${c.id})">✏️</button>
        <button class="btn b-red b-sm" onclick="deleteClient(${c.id})">🗑</button>
      </div>
    </div>`).join("") : `<div class="empty"><div class="empty-ic">🔍</div>Sin resultados para "${esc(searchQ)}"</div>`}
  </div>`;
}

// ── MESSAGES ─────────────────────────────────────────────────────────────────
const TEMPLATES = {
  thanks:[
    {id:"t1",label:"Post-venta calidez",text:n=>`¡Hola ${n}! 🌸 Gracias por confiar en Lienzo Floral. Espero que tu arreglo haya llenado ese momento especial de belleza. Si tienes algún comentario o foto que quieras compartir, ¡nos encantaría verla! Con cariño, Lienzo Floral 🌿`},
    {id:"t2",label:"Post-venta profesional",text:n=>`Hola ${n}, gracias por tu compra en Lienzo Floral. Fue un placer preparar tu pedido. Si necesitas algo más o tienes alguna duda, estamos aquí para ayudarte. ¡Hasta pronto! — Lienzo Floral`},
  ],
  followup:[
    {id:"f1",label:"Recordatorio suave",text:n=>`¡Hola ${n}! 🌷 Ha pasado un tiempo desde tu última visita a Lienzo Floral y queremos saber cómo estás. ¿Se acerca alguna ocasión especial? Tenemos arreglos nuevos que te van a encantar. ¡Escríbenos cuando quieras! 🌸`},
    {id:"f2",label:"Invitación colección nueva",text:n=>`Hola ${n} ✨ En Lienzo Floral acabamos de renovar nuestra colección de temporada y pensamos en ti. ¿Te gustaría ver lo que tenemos? Contamos con diseños exclusivos para cada ocasión. ¡Te esperamos! 🌿`},
  ],
  birthday:[{id:"b1",label:"Cumpleaños cliente",text:n=>`¡Feliz cumpleaños ${n}! 🎂🌸 En Lienzo Floral te deseamos un día lleno de amor y flores. Como regalo, te ofrecemos un 10% de descuento en tu próximo pedido. ¡Disfruta tu día especial! 🥂`}],
  promo:[
    {id:"p1",label:"Promoción general",text:n=>`¡Hola ${n}! 🌺 Esta semana en Lienzo Floral tenemos una promoción especial que no querrás perderte. Escríbenos y te contamos todos los detalles. ¡Síguenos en Instagram @lienzo.floral para más sorpresas! 💐`},
    {id:"p2",label:"🌹 Arreglo de rosas rojas $349",text:n=>`¡Hola ${n}! 🌹 Tenemos una promoción especial para ti en Lienzo Floral:\n\n🌹 Arreglo de rosas rojas desde $349\n\nElegantes, frescas y llenas de amor — perfectas para sorprender a alguien especial o simplemente para llenar de belleza tu hogar 🌿\n\n¿Te interesa? Escríbenos y con gusto te damos más detalles. ¡Síguenos en Instagram @lienzo.floral 💐`,isPromo:true},
  ],
};

const PROMO_IMAGE = "https://images.unsplash.com/photo-1587530588853-5e23e69e4e7e?w=700&q=80&fit=crop";

function renderMsgTemplates(clientName){
  const cats=[["thanks","🌸","Post-Venta"],["followup","💌","Seguimiento"],["birthday","🎂","Cumpleaños"],["promo","🌺","Promoción"]];
  return cats.map(([key,icon,lbl])=>`
    <div class="mc-cat">${icon} ${lbl}</div>
    ${TEMPLATES[key].map(tpl=>{
      const text=tpl.text(clientName);
      if(tpl.isPromo){
        return `<div class="promo-card">
          <img class="promo-img" src="${PROMO_IMAGE}" alt="Arreglo rosas rojas" onerror="this.style.display='none'"/>
          <div class="promo-body">
            <span class="promo-price">🌹 Desde $349</span>
            <div class="mc-lbl" style="margin-top:4px">${tpl.label}</div>
            <div class="mc-txt" style="white-space:pre-line">${esc(text)}</div>
            <div style="display:flex;gap:7px;margin-top:10px">
              <button class="btn b-dark b-sm" onclick="copyMsg(${JSON.stringify(text)},this)">📋 Copiar</button>
              <button class="btn b-sage b-sm" onclick="openWAtext('${esc(clientName)}',${JSON.stringify(text)})">💬 WhatsApp</button>
            </div>
          </div>
        </div>`;
      }
      return `<div class="mc">
        <div class="mc-lbl">${tpl.label}</div>
        <div class="mc-txt">${esc(text)}</div>
        <div style="display:flex;gap:7px;margin-top:9px">
          <button class="btn b-dark b-sm" onclick="copyMsg(${JSON.stringify(text)},this)">📋 Copiar</button>
          <button class="btn b-sage b-sm" onclick="openWAtext('${esc(clientName)}',${JSON.stringify(text)})">💬 WhatsApp</button>
        </div>
      </div>`;
    }).join("")}
  `).join("");
}

function renderMessages(){
  const q=searchQ.toLowerCase();
  const filtered=clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  const sel=clients.find(c=>c.id===selectedClientId);
  return `
  <div class="g2" style="align-items:start">
    <div class="card">
      <div class="ch"><h3>Seleccionar Cliente</h3></div>
      <div style="padding:11px 16px 7px"><input class="si" id="search-inp" placeholder="Buscar…" value="${esc(searchQ)}" style="margin-bottom:8px"/></div>
      <div class="scroll-inner">
        ${filtered.map(c=>`
        <div class="crow" style="cursor:pointer;background:${selectedClientId===c.id?"#f5f0ea":""}" data-sel-client="${c.id}">
          ${av(c.name)}
          <div style="flex:1">
            <div style="font-size:13.5px;font-weight:500">${esc(c.name)}</div>
            <div style="font-size:12px;color:#7a7a7a">Última compra: hace ${daysSince(c.lastPurchase)} días</div>
          </div>
          ${selectedClientId===c.id?`<span style="color:#7a9e7e;font-size:17px">✓</span>`:""}
        </div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="ch"><h3>${sel?`Para ${sel.name.split(" ")[0]}`:"Elige un cliente"}</h3></div>
      <div style="padding:14px 18px">
        ${sel ? renderMsgTemplates(sel.name) : `<div class="empty"><div class="empty-ic">👈</div>Selecciona un cliente de la lista</div>`}
      </div>
    </div>
  </div>`;
}

// ── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar(){
  const dim=(m,y)=>new Date(y,m+1,0).getDate();
  const fd=(m,y)=>new Date(y,m,1).getDay();
  const ecls={confirmed:"evc",pending:"evp",delivered:"evd",cancelled:"evx"};
  let cells="";
  for(let i=0;i<fd(calMonth,calYear);i++) cells+=`<div></div>`;
  for(let day=1;day<=dim(calMonth,calYear);day++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const isToday=ds===TODAY;
    const evs=deliveries.filter(d=>d.date===ds);
    cells+=`<div class="cday${isToday?" ctoday":""}" onclick="openDelivModal('${ds}')">
      <div class="cnum">${day}</div>
      ${evs.map(d=>`<div class="cev ${ecls[d.status]||"evp"}" onclick="event.stopPropagation();openDelivModal(null,${d.id})">${d.time} ${d.clientName.split(" ")[0]}</div>`).join("")}
    </div>`;
  }
  return `
  <div class="card">
    <div class="ch">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn b-ghost b-sm" onclick="prevMonth()">‹</button>
        <span style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;min-width:160px;text-align:center">${MONTHS[calMonth]} ${calYear}</span>
        <button class="btn b-ghost b-sm" onclick="nextMonth()">›</button>
      </div>
      <button class="btn b-sage b-sm" onclick="openDelivModal()">+ Agendar</button>
    </div>
    <div style="padding:14px">
      <div class="cal-grid" style="margin-bottom:4px">${DAYS.map(d=>`<div class="cdn">${d}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}
function prevMonth(){ if(calMonth===0){calMonth=11;calYear--;}else calMonth--; renderPage(); }
function nextMonth(){ if(calMonth===11){calMonth=0;calYear++;}else calMonth++; renderPage(); }

// ── DELIVERIES ────────────────────────────────────────────────────────────────
function renderDeliveries(){
  const sorted=[...deliveries].sort((a,b)=>a.date.localeCompare(b.date));
  return `
  <div class="card">
    <div class="ch"><h3>${deliveries.length} entrega${deliveries.length!==1?"s":""}</h3></div>
    ${sorted.length ? sorted.map(d=>`
    <div class="dr">
      <div class="dd"><div class="ddn">${d.date.split("-")[2]}</div><div class="ddm">${MONTHS[parseInt(d.date.split("-")[1])-1].slice(0,3)}</div></div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500">${esc(d.clientName)}</div>
        <div style="font-size:12px;color:#7a7a7a">${esc(d.product)}</div>
        <div style="font-size:11px;color:#9a9a9a">${esc(d.address)}</div>
      </div>
      <div style="text-align:center;margin-right:10px;flex-shrink:0">
        <div style="font-size:13px;font-weight:500;margin-bottom:4px">${d.time}</div>
        ${badge(d.status)}
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="btn b-ghost b-sm" onclick="openDelivModal(null,${d.id})">✏️ Editar</button>
        <button class="btn b-red b-sm" onclick="deleteDeliv(${d.id})">🗑</button>
      </div>
    </div>`).join("") : `<div class="empty"><div class="empty-ic">📭</div>Sin entregas registradas</div>`}
  </div>`;
}

// ─── BIND PAGE EVENTS ────────────────────────────────────────────────────────
function bindPageEvents(){
  // search
  const si=document.getElementById("search-inp");
  if(si) si.addEventListener("input",e=>{ searchQ=e.target.value; renderPage(); });
  // select client
  document.querySelectorAll("[data-sel-client]").forEach(el=>{
    el.addEventListener("click",e=>{
      const id=parseInt(e.currentTarget.dataset.selClient);
      selectedClientId=id;
      if(currentTab==="dashboard"){ switchTab("messages"); }
      else renderPage();
    });
  });
}

// ─── CLIENT MODAL ────────────────────────────────────────────────────────────
function openClientModal(editId=null){
  const c=editId?clients.find(x=>x.id===editId):null;
  const html=`
  <div class="ov" id="mod-ov" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mhead">
        <div><div class="mtitle">${c?"Editar Cliente":"Nuevo Cliente"}</div></div>
        <button class="mclose" onclick="closeModal()">×</button>
      </div>
      <div class="mbody">
        <div class="g2">
          <div class="fld"><label class="flbl">Nombre completo *</label><input class="inp" id="cf-name" value="${esc(c?.name||"")}" placeholder="Nombre Apellido"/></div>
          <div class="fld"><label class="flbl">Teléfono *</label><input class="inp" id="cf-phone" value="${esc(c?.phone||"")}" placeholder="5512345678"/></div>
        </div>
        <div class="fld"><label class="flbl">Correo electrónico</label><input class="inp" id="cf-email" value="${esc(c?.email||"")}" placeholder="correo@email.com"/></div>
        <div class="fld"><label class="flbl">Etiquetas (separadas por coma)</label><input class="inp" id="cf-tags" value="${esc((c?.tags||[]).join(", "))}" placeholder="boda, frecuente, corporativo…"/></div>
        <div class="fld"><label class="flbl">Notas y preferencias</label><textarea class="inp" id="cf-notes" placeholder="Flores favoritas, ocasiones especiales…">${esc(c?.notes||"")}</textarea></div>
        <div style="display:flex;gap:7px;justify-content:flex-end;margin-top:4px">
          <button class="btn b-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn b-dark" onclick="saveClient(${editId||"null"})">${c?"Guardar Cambios":"Agregar Cliente"}</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById("modal-container").innerHTML=html;
}

function saveClient(editId){
  const name=document.getElementById("cf-name").value.trim();
  const phone=document.getElementById("cf-phone").value.trim();
  if(!name||!phone){ alert("Nombre y teléfono son obligatorios"); return; }
  const email=document.getElementById("cf-email").value.trim();
  const tags=document.getElementById("cf-tags").value.split(",").map(t=>t.trim()).filter(Boolean);
  const notes=document.getElementById("cf-notes").value.trim();
  if(editId){
    clients=clients.map(c=>c.id===editId?{...c,name,phone,email,tags,notes}:c);
    toast("Cliente actualizado ✓");
  } else {
    clients.push({id:Date.now(),name,phone,email,lastPurchase:TODAY,totalOrders:0,tags,notes});
    toast("Cliente guardado ✓");
  }
  saveClients(); closeModal(); renderPage();
}

function deleteClient(id){
  if(!confirm("¿Eliminar este cliente?")) return;
  clients=clients.filter(c=>c.id!==id);
  saveClients(); renderPage(); toast("Cliente eliminado");
}

// ─── DELIVERY MODAL ───────────────────────────────────────────────────────────
function openDelivModal(prefillDate=null, editId=null){
  const d=editId?deliveries.find(x=>x.id===editId):null;
  const date=d?.date||prefillDate||"";
  const html=`
  <div class="ov" id="mod-ov" onclick="closeModal()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="mhead">
        <div><div class="mtitle">${d?"Editar Entrega":"Agendar Entrega"}</div></div>
        <button class="mclose" onclick="closeModal()">×</button>
      </div>
      <div class="mbody">
        <div class="g2">
          <div class="fld"><label class="flbl">Cliente *</label>
            <select class="inp" id="df-client">
              <option value="">Seleccionar…</option>
              ${clients.map(c=>`<option value="${c.id}" ${d?.clientId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
            </select>
          </div>
          <div class="fld"><label class="flbl">Estado</label>
            <select class="inp" id="df-status">
              ${["pending","confirmed","delivered","cancelled"].map(s=>`<option value="${s}" ${(d?.status||"pending")===s?"selected":""}>${{pending:"Pendiente",confirmed:"Confirmada",delivered:"Entregada",cancelled:"Cancelada"}[s]}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="g2">
          <div class="fld"><label class="flbl">Fecha *</label><input class="inp" type="date" id="df-date" value="${date}"/></div>
          <div class="fld"><label class="flbl">Hora</label><input class="inp" type="time" id="df-time" value="${d?.time||""}"/></div>
        </div>
        <div class="fld"><label class="flbl">Producto / Arreglo</label><input class="inp" id="df-product" value="${esc(d?.product||"")}" placeholder="Ej: Ramo de rosas rojas, 50 tallos"/></div>
        <div class="fld"><label class="flbl">Dirección de entrega</label><input class="inp" id="df-address" value="${esc(d?.address||"")}" placeholder="Calle, número, colonia…"/></div>
        <div class="fld"><label class="flbl">Notas internas</label><textarea class="inp" id="df-notes" placeholder="Instrucciones especiales, acceso, etc.">${esc(d?.notes||"")}</textarea></div>
        <div style="display:flex;gap:7px;justify-content:space-between;margin-top:4px">
          <div>${editId?`<button class="btn b-red" onclick="deleteDeliv(${editId})">🗑 Eliminar</button>`:""}</div>
          <div style="display:flex;gap:7px">
            <button class="btn b-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn b-dark" onclick="saveDeliv(${editId||"null"})">${d?"Guardar Cambios":"Agendar Entrega"}</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById("modal-container").innerHTML=html;
}

function saveDeliv(editId){
  const clientId=parseInt(document.getElementById("df-client").value);
  const client=clients.find(c=>c.id===clientId);
  if(!client){ alert("Selecciona un cliente"); return; }
  const date=document.getElementById("df-date").value;
  if(!date){ alert("La fecha es obligatoria"); return; }
  const obj={
    id:editId||Date.now(), clientId, clientName:client.name,
    date, time:document.getElementById("df-time").value,
    product:document.getElementById("df-product").value.trim(),
    address:document.getElementById("df-address").value.trim(),
    status:document.getElementById("df-status").value,
    notes:document.getElementById("df-notes").value.trim(),
  };
  if(editId) { deliveries=deliveries.map(d=>d.id===editId?obj:d); toast("Entrega actualizada ✓"); }
  else       { deliveries.push(obj); toast("Entrega agendada ✓"); }
  saveDeliveries(); closeModal(); renderPage();
}

function deleteDeliv(id){
  if(!confirm("¿Eliminar esta entrega?")) return;
  deliveries=deliveries.filter(d=>d.id!==id);
  saveDeliveries(); closeModal(); renderPage(); toast("Entrega eliminada");
}

// ─── MESSAGE MODAL ────────────────────────────────────────────────────────────
function openMsgModal(clientId){
  selectedClientId=clientId;
  const c=clients.find(x=>x.id===clientId);
  if(!c) return;
  const html=`
  <div class="ov" id="mod-ov" onclick="closeModal()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="mhead">
        <div><div class="mtitle">Mensajes para ${esc(c.name)}</div><div class="msub">${esc(c.phone)}</div></div>
        <button class="mclose" onclick="closeModal()">×</button>
      </div>
      <div class="mbody">${renderMsgTemplates(c.name)}</div>
    </div>
  </div>`;
  document.getElementById("modal-container").innerHTML=html;
}

function closeModal(){ document.getElementById("modal-container").innerHTML=""; }

// ─── WA & COPY ────────────────────────────────────────────────────────────────
function copyMsg(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.textContent; btn.textContent="✓ Copiado";
    setTimeout(()=>btn.textContent=orig,2000);
    toast("Mensaje copiado ✓");
  }).catch(()=>{ toast("No se pudo copiar — copia manualmente"); });
}
function openWA(phone,text){ window.open(`https://wa.me/52${phone.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`,"_blank"); }
function openWAtext(name,text){ const c=clients.find(x=>x.name.includes(name.split(" ")[0])); if(c) openWA(c.phone,text); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderActions();
renderPage();
</script>
</body>
</html>
